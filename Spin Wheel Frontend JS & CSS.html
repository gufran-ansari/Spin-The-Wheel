<style>
  @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap");

  :root {
    --spin-bg: #fcfcfd;
    --spin-text: #0f172a;
    --spin-muted: #64748b;
    --spin-input-bg: #f8fafc;
    --spin-input-border: #e2e8f0;
    --spin-card-border: #f1f5f9;
    --spin-highlight: #facc15;
    --spin-wheel-size-desktop: 600px;
    --spin-form-width-desktop: 550px;
    --spin-desktop-gap: 2rem;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  header,
  footer {
    display: none !important;
  }

  body {
    font-family: "Manrope", sans-serif;
    color: var(--spin-text);
    background: var(--spin-bg);
    overflow-x: hidden;
  }

  .elementor-section {
    padding-top: 0 !important;
    padding-bottom: 0 !important;
  }

  .elementor-shortcode,
  .elementor-widget-container {
    width: 100%;
  }

  #spin-wheel-app {
    position: relative;
    width: 100vw;
    max-width: 100vw;
    min-height: 100vh;
    margin-left: calc(50% - 50vw);
    margin-right: calc(50% - 50vw);
    padding: 1rem;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--spin-bg);
  }

  .spin-pattern {
    position: absolute;
    inset: 0;
    opacity: 0.03;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .spin-shell {
    position: relative;
    z-index: 1;
    width: min(1280px, 100%);
    display: flex;
    flex-direction: column-reverse;
    gap: 2.25rem;
    align-items: center;
    justify-content: center;
  }

  .spin-wheel-column,
  .spin-form-column {
    width: 100%;
    display: flex;
    justify-content: center;
  }

  .spin-wheel-stage {
    position: relative;
  }

  .spin-wheel-clacker {
    position: absolute;
    top: 50%;
    right: 8%;
    left: auto;
    transform: translate(100%, -50%) rotate(180deg);
    z-index: 40;
    display: flex;
    align-items: center;
  }

  .spin-wheel-clacker-tip {
    width: 48px;
    height: 40px;
    background: #0f172a;
    clip-path: polygon(100% 50%, 0 0, 0 100%);
    border-top: 2px solid #334155;
    border-bottom: 2px solid #334155;
    border-left: 2px solid #334155;
    box-shadow: 0 12px 24px rgba(15, 23, 42, 0.3);
  }

  .spin-wheel-clacker-dot {
    position: absolute;
    right: -8px;
    width: 16px;
    height: 16px;
    border-radius: 999px;
    background: #eab308;
    border: 2px solid #fff;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.2);
  }

  .spin-wheel-container {
    position: relative;
    width: min(84vw, var(--spin-wheel-size-desktop));
    height: min(84vw, var(--spin-wheel-size-desktop));
    border-radius: 50%;
    box-shadow: 0 28px 50px -20px rgba(15, 23, 42, 0.25);
    box-sizing: border-box;
  }

  .gold-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, #fef08a 0%, #fbbf24 35%, #f59e0b 100%);
    box-shadow: 0 0 22px rgba(251, 191, 36, 0.4);
    z-index: 1;
  }

  #spin-wheel-wheel {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  #spin-wheel-image {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    overflow: hidden;
    transform-origin: 50% 50%;
    will-change: transform;
    transition: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
  }

  .wheel-segment {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    clip-path: polygon(50% 50%, 100% 0, 100% 100%);
    transform-origin: 50% 50%;
  }

  .seg-0 {
    transform: rotate(0deg);
  }

  .seg-1 {
    transform: rotate(90deg);
  }

  .seg-2 {
    transform: rotate(180deg);
  }

  .seg-3 {
    transform: rotate(270deg);
  }

  .segment-text {
    position: absolute;
    top: 50%;
    left: 79%;
    width: 150px;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: clamp(0.85rem, 1.45vw, 1.35rem);
    line-height: 1.12;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-shadow:
      0 2px 4px rgba(0, 0, 0, 0.5),
      0 0 8px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    white-space: nowrap;
  }

  .seg-0 .segment-text {
    transform: translate(-50%, -70%) rotate(0deg);
  }

  .seg-1 .segment-text {
    transform: translate(-50%, -50%) rotate(360deg);
  }

  .seg-2 .segment-text {
    transform: translate(-50%, -30%) rotate(0deg);
  }

  .seg-3 .segment-text {
    transform: translate(-50%, -50%) rotate(0deg);
  }

  .spin-wheel-center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: clamp(74px, 9vw, 128px);
    height: clamp(74px, 9vw, 128px);
    border-radius: 50%;
    background: #ffffff;
    border: 8px solid #f8fafc;
    box-shadow: 0 20px 34px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 12;
  }

  .spin-wheel-center-cap .spin-icon-crown {
    width: clamp(22px, 2.4vw, 34px);
    height: clamp(22px, 2.4vw, 34px);
    color: #eab308;
    margin-bottom: 2px;
  }

  .spin-wheel-center-cap span {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 800;
    color: #94a3b8;
  }

  .spin-wheel-stand-shadow {
    position: absolute;
    left: 50%;
    bottom: -38px;
    transform: translateX(-50%);
    width: 60%;
    height: 40px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.1);
    filter: blur(26px);
  }

  .spin-form-column {
    width: min(100%, var(--spin-form-width-desktop));
  }

  .spin-wheel-form-card {
    position: relative;
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--spin-card-border);
    border-radius: 3rem;
    padding: 2rem 1.4rem;
    box-sizing: border-box;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.08);
  }

  .spin-live-badge {
    position: absolute;
    top: -16px;
    right: -10px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #facc15;
    color: #0f172a;
    font-weight: 900;
    font-size: 0.83rem;
    padding: 0.64rem 1rem;
    border-radius: 1rem;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    transform: rotate(12deg);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .spin-live-badge .spin-icon {
    width: 18px;
    height: 18px;
  }

  .spin-form-header {
    margin-bottom: 2rem;
  }

  .spin-kicker {
    margin: 0 0 0.6rem;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #94a3b8;
  }

  .spin-title {
    margin: 0 0 0.8rem;
    font-family: "Sora", sans-serif;
    font-size: clamp(2rem, 5.2vw, 3.35rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: #0f172a;
  }

  .spin-subtitle {
    margin: 0;
    color: #64748b;
    font-size: clamp(0.95rem, 2.2vw, 1.1rem);
    font-weight: 500;
    line-height: 1.6;
  }

  .spin-form-error {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0.8rem 0 0;
    padding: 0.9rem 1rem;
    border-left: 4px solid #ef4444;
    border-radius: 0 0.9rem 0.9rem 0;
    background: #fef2f2;
    color: #b91c1c;
  }

  .spin-form-error[hidden] {
    display: none !important;
  }

  .spin-form-error .spin-icon {
    width: 18px;
    height: 18px;
    flex: 0 0 auto;
  }

  .spin-form-error p {
    margin: 0;
    font-size: 0.83rem;
    font-weight: 700;
    line-height: 1.4;
  }

  #spin-wheel-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .spin-field-group {
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
  }

  .spin-field-group > label {
    margin-left: 4px;
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #94a3b8;
  }

  .spin-input-wrap {
    position: relative;
  }

  .spin-input-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translateY(-50%);
    color: #cbd5e1;
    transition: color 0.2s ease;
    pointer-events: none;
  }

  #spin-wheel-form input {
    width: 100%;
    height: 58px;
    border: 2px solid var(--spin-input-border);
    border-radius: 1rem;
    padding: 0 1rem 0 3rem;
    font-size: 0.98rem;
    font-weight: 700;
    color: #0f172a;
    background: var(--spin-input-bg);
    box-sizing: border-box;
    transition:
      border-color 0.2s ease,
      background-color 0.2s ease,
      box-shadow 0.2s ease;
  }

  #spin-wheel-form input::placeholder {
    color: #94a3b8;
  }

  #spin-wheel-form input:hover {
    border-color: #cbd5e1;
  }

  #spin-wheel-form input:focus {
    outline: none;
    background: #ffffff;
    border-color: #facc15;
    box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2);
  }

  .spin-input-wrap:focus-within .spin-input-icon {
    color: #eab308;
  }

  .spin-grid-two {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .spin-agree-row {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin: 0.3rem 0 0.1rem;
  }

  .spin-agree-row input[type="checkbox"] {
    width: 3%;
    min-width: 14px;
    max-width: 18px;
    aspect-ratio: 1 / 1;
    margin-top: 0;
    border-radius: 0.5rem;
    border: 2px solid #cbd5e1;
    accent-color: #eab308;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .spin-agree-row span {
    font-size: 0.76rem;
    line-height: 1.55;
    color: #94a3b8;
    font-weight: 600;
  }

  .spin-agree-row a {
    color: #0f172a;
    text-decoration: underline;
    font-weight: 800;
  }

  #spin-wheel-btn {
    width: 100%;
    min-height: 68px;
    border: none;
    border-radius: 1.4rem;
    background: #0f172a;
    color: #ffffff;
    font-family: "Sora", sans-serif;
    font-size: 1.05rem;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    cursor: pointer;
    box-shadow: 0 20px 30px -18px rgba(15, 23, 42, 0.6);
    transition:
      transform 0.15s ease,
      background-color 0.2s ease,
      box-shadow 0.2s ease,
      color 0.2s ease;
  }

  .spin-btn-label {
    pointer-events: none;
  }

  .spin-btn-icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    pointer-events: none;
  }

  #spin-wheel-btn:hover:not(:disabled) {
    background: #020617;
    box-shadow: 0 24px 36px -20px rgba(15, 23, 42, 0.62);
  }

  #spin-wheel-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  #spin-wheel-btn.is-loading {
    background: #f1f5f9;
    color: #94a3b8;
    cursor: not-allowed;
    box-shadow: none;
  }

  #spin-wheel-btn.is-loading .spin-btn-icon {
    display: none;
  }

  #spin-wheel-btn:disabled {
    cursor: not-allowed;
  }

  .spin-result-modal[hidden] {
    display: none !important;
  }

  .spin-result-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;
    padding: 1.5rem;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.22s ease;
  }

  .spin-result-modal.is-open {
    opacity: 1;
  }

  .spin-result-card {
    position: relative;
    width: min(420px, 100%);
    background: #ffffff;
    border: 1px solid #ffffff;
    border-radius: 2.25rem;
    padding: 2.2rem 1.5rem;
    box-shadow: 0 45px 60px -18px rgba(15, 23, 42, 0.45);
    text-align: center;
    overflow: hidden;
  }

  .spin-result-glow {
    position: absolute;
    top: -40px;
    left: -40px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: rgba(250, 204, 21, 0.2);
    filter: blur(35px);
  }

  .spin-result-gift {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    margin: 0 auto 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 20px 30px -16px rgba(15, 23, 42, 0.3);
  }

  .spin-result-gift .spin-icon {
    width: 42px;
    height: 42px;
  }

  .spin-result-gift.is-win {
    background: #facc15;
    color: #0f172a;
  }

  .spin-result-gift.is-loss {
    background: #f1f5f9;
    color: #94a3b8;
  }

  #spin-result-title {
    margin: 0 0 0.65rem;
    font-family: "Sora", sans-serif;
    font-size: clamp(2rem, 7vw, 2.35rem);
    line-height: 1;
    letter-spacing: -0.03em;
    color: #0f172a;
  }

  #spin-result-text {
    margin: 0 0 1.65rem;
    color: #64748b;
    font-size: 0.96rem;
    font-weight: 700;
    line-height: 1.6;
  }

  #spin-result-close {
    width: 100%;
    border: none;
    border-radius: 1rem;
    background: #0f172a;
    color: #ffffff;
    font-family: "Sora", sans-serif;
    font-weight: 800;
    font-size: 1rem;
    padding: 1.05rem 1rem;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  #spin-result-close:hover {
    background: #020617;
  }

  .spin-icon {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    flex: 0 0 auto;
  }

  @media (min-width: 700px) {
    .spin-wheel-form-card {
      padding: 2.5rem;
    }

    .spin-grid-two {
      grid-template-columns: 1fr 1fr;
    }

    .spin-result-card {
      padding: 2.8rem;
    }
  }

  @media (min-width: 1024px) {
    #spin-wheel-app {
      min-height: 100vh;
      padding: 1rem 1.3rem;
    }

    .spin-shell {
      flex-direction: row;
      gap: var(--spin-desktop-gap);
      width: min(1240px, 100%);
    }

    .spin-wheel-column {
      flex: 0 0 var(--spin-wheel-size-desktop);
    }

    .spin-form-column {
      flex: 0 0 var(--spin-form-width-desktop);
      width: var(--spin-form-width-desktop);
    }

    .spin-wheel-container {
      width: var(--spin-wheel-size-desktop);
      height: var(--spin-wheel-size-desktop);
    }

    .spin-wheel-form-card {
      padding: 3rem;
    }
  }

  @media (max-width: 1280px) {
    .spin-wheel-container {
      width: min(74vw, 540px);
      height: min(74vw, 540px);
    }

    .spin-form-column {
      width: min(100%, 520px);
    }
  }

  @media (max-width: 1023px) {
    #spin-wheel-app {
      padding: 1rem 0.7rem;
    }

    .spin-shell {
      gap: 1.35rem;
    }

    .spin-form-column {
      width: min(100%, 560px);
    }

    .spin-wheel-container {
      width: min(84vw, 420px);
      height: min(84vw, 420px);
    }

    .spin-wheel-clacker {
      right: 8%;
      left: auto;
    }
  }

  @media (max-width: 560px) {
    .spin-wheel-clacker {
      right: 8%;
      left: auto;
    }

    .spin-wheel-clacker-tip {
      width: 34px;
      height: 28px;
    }

    .spin-wheel-clacker-dot {
      width: 13px;
      height: 13px;
      right: -6px;
    }

    .spin-wheel-container {
      width: min(82vw, 320px);
      height: min(82vw, 320px);
    }

    #spin-wheel-image {
      inset: 9px;
    }

    .segment-text {
      width: 104px;
      font-size: 0.78rem;
    }

    .spin-wheel-form-card {
      border-radius: 2rem;
      padding: 1.5rem 1rem;
    }

    .spin-title {
      font-size: clamp(1.7rem, 8vw, 2.2rem);
    }

    #spin-wheel-btn {
      min-height: 60px;
      font-size: 0.95rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const wheel = document.getElementById("spin-wheel-image");
    const form = document.getElementById("spin-wheel-form");
    const btn = document.getElementById("spin-wheel-btn");
    const btnLabel = btn ? btn.querySelector(".spin-btn-label") : null;

    const errorBox = document.getElementById("spin-wheel-error");
    const errorText = document.getElementById("spin-wheel-error-text");

    const modal = document.getElementById("spin-result-modal");
    const modalGift = document.getElementById("spin-result-gift");
    const modalTitle = document.getElementById("spin-result-title");
    const modalText = document.getElementById("spin-result-text");
    const modalClose = document.getElementById("spin-result-close");

    if (
      !wheel ||
      !form ||
      !btn ||
      !btnLabel ||
      !errorBox ||
      !errorText ||
      !modal ||
      !modalGift ||
      !modalTitle ||
      !modalText ||
      !modalClose
    ) {
      console.error("Spin wheel UI elements are missing.");
      return;
    }

    const fields = {
      name: form.querySelector('input[name="name"]'),
      email: form.querySelector('input[name="email"]'),
      mobile: form.querySelector('input[name="mobile"]'),
      location: form.querySelector('input[name="location"]'),
      consent: form.querySelector('input[name="consent"]'),
    };

    if (
      !fields.name ||
      !fields.email ||
      !fields.mobile ||
      !fields.location ||
      !fields.consent
    ) {
      console.error("Form fields are missing.");
      return;
    }

    const segments = wheel.querySelectorAll(".wheel-segment");

    const WHEEL_SEGMENTS = [
      {
        image:
          "https://tools.codezyners.in/wp-content/uploads/2025/12/red.webp",
        fallback: "linear-gradient(145deg, #ef4444 0%, #be123c 100%)",
      },
      {
        image:
          "https://tools.codezyners.in/wp-content/uploads/2025/12/green.webp",
        fallback: "linear-gradient(145deg, #22c55e 0%, #15803d 100%)",
      },
      {
        image:
          "https://tools.codezyners.in/wp-content/uploads/2025/12/blue.webp",
        fallback: "linear-gradient(145deg, #3b82f6 0%, #1d4ed8 100%)",
      },
      {
        image:
          "https://tools.codezyners.in/wp-content/uploads/2025/12/gray.webp",
        fallback: "linear-gradient(145deg, #9ca3af 0%, #4b5563 100%)",
      },
    ];

    segments.forEach((seg, i) => {
      const config = WHEEL_SEGMENTS[i];
      if (!config) return;
      seg.style.backgroundImage = `url(${config.image}), ${config.fallback}`;
      seg.style.backgroundSize = "cover, cover";
      seg.style.backgroundPosition = "center, center";
    });

    let currentRotation = 0;
    let spinning = false;

    const setInlineError = (message) => {
      if (!message) {
        errorBox.hidden = true;
        errorText.textContent = "";
        return;
      }

      errorText.textContent = message;
      errorBox.hidden = false;
    };

    const setLoading = (loading) => {
      btn.disabled = loading;
      btn.classList.toggle("is-loading", loading);
      btnLabel.textContent = loading ? "Randomizing..." : "Spin To Win";
    };

    const closeModal = (resetForm) => {
      modal.classList.remove("is-open");
      setTimeout(() => {
        modal.hidden = true;
      }, 220);

      if (resetForm) {
        form.reset();
        setInlineError("");
      }
    };

    const openModal = ({ isVoucher, heading, body }) => {
      modalGift.classList.remove("is-win", "is-loss");
      modalGift.classList.add(isVoucher ? "is-win" : "is-loss");

      modalTitle.textContent = heading;
      modalText.textContent = body;

      modal.hidden = false;
      requestAnimationFrame(() => {
        modal.classList.add("is-open");
      });
    };

    const validate = () => {
      const name = fields.name.value.trim();
      const email = fields.email.value.trim();
      const mobile = fields.mobile.value.trim();
      const location = fields.location.value.trim();

      if (!name || !email || !mobile || !location) {
        return "We need your details to ship the prize. Don't leave them blank.";
      }

      if (!fields.consent.checked) {
        return "Please accept the terms to proceed.";
      }

      return "";
    };

    form.addEventListener("input", () => {
      if (!spinning) {
        setLoading(false);
      }

      if (!errorBox.hidden) {
        setInlineError("");
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (spinning) return;

      const validationMessage = validate();
      if (validationMessage) {
        setInlineError(validationMessage);
        return;
      }

      setInlineError("");
      spinning = true;
      setLoading(true);

      try {
        const data = new FormData();
        data.append("action", "spin_wheel");
        data.append("name", fields.name.value.trim());
        data.append("email", fields.email.value.trim());
        data.append("mobile", fields.mobile.value.trim());
        data.append("location", fields.location.value.trim());

        const res = await fetch("/wp-admin/admin-ajax.php", {
          method: "POST",
          body: data,
        });

        const json = await res.json();

        if (!json.success) {
          setInlineError(json.data?.message || "Something went wrong.");
          spinning = false;
          setLoading(false);
          return;
        }

        const indexMap = {
          voucher_1000: [0],
          voucher_500: [2],
          blnt: [1, 3],
        };

        const resultKey = json?.data?.result_key;
        const resultLabel = json?.data?.result_label || "";
        const possibleIndexes = indexMap[resultKey] || [1];
        const winningIndex =
          possibleIndexes[Math.floor(Math.random() * possibleIndexes.length)];

        const pointerAngle = 0;
        const targetSegmentCenter = winningIndex * 90;
        const currentSegmentAngle =
          (currentRotation + targetSegmentCenter) % 360;
        const alignDelta = (pointerAngle - currentSegmentAngle + 360) % 360;

        const spins = 2880;
        const newRotation = currentRotation + spins + alignDelta;

        wheel.style.transition = "transform 4500ms cubic-bezier(0.2, 0, 0, 1)";
        wheel.style.transform = `rotate(${newRotation}deg)`;

        setTimeout(() => {
          spinning = false;
          setLoading(false);
          currentRotation = newRotation % 360;

          const firstName = fields.name.value.trim().split(/\s+/)[0] || "there";
          const isVoucher =
            resultKey === "voucher_1000" || resultKey === "voucher_500";

          const resultText = isVoucher
            ? resultLabel.toUpperCase()
            : winningIndex === 1
              ? "TRY AGAIN"
              : "NEXT TIME";

          openModal({
            isVoucher,
            heading: isVoucher ? "Jackpot!" : "Missed It.",
            body: isVoucher
              ? `Congratulations ${firstName}! You've won ${resultText}.`
              : "Not your lucky spin. Try again tomorrow!",
          });
        }, 4500);
      } catch (err) {
        console.error(err);
        setInlineError("Network error. Please try again.");
        spinning = false;
        setLoading(false);
      }
    });

    modalClose.addEventListener("click", () => {
      closeModal(true);
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal(true);
      }
    });
  });
</script>
